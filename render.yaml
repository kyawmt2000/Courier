services:
  - type: web
    name: courier-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
